definitions:
  bubdong_setup:
    - &bubdong_env_file
      name: .env.bubdong 만들기 (분석용)
      script: |
        # pubspec에 등록된 .env.bubdong 이 없으면 정적 분석이 실패하므로 예시 파일로 만든다.
        cp .env.bubdong.example .env.bubdong
    - &pub_get
      name: 패키지 받기
      script: flutter pub get

workflows:
  bubdong-pr:
    name: 법동 Android PR 확인
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: develop
          include: true
          source: false
        - pattern: main
          include: true
          source: false
      cancel_previous_builds: true
    scripts:
      - *bubdong_env_file
      - *pub_get
      - name: 정적 분석
        script: flutter analyze
      - name: 법동 debug 빌드
        script: flutter build appbundle --debug --flavor bubdong -t lib/main_bubdong.dart